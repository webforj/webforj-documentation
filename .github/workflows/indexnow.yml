name: Notify IndexNow

# Runs on its own after each successful deploy, so the deploy never waits for it.
# Tells Bing and the other IndexNow engines which pages changed recently.
on:
  workflow_run:
    workflows: ['Build and Deploy WAR']
    types: [completed]
  workflow_dispatch:

# Only the newest run matters: each run sends the pages changed since the last
# completed run, so a new deploy cancels the run still waiting from the previous one.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The lastmod values sent by the previous run, so each changed page is sent once.
      - name: Restore Sent Pages
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/sent.json
          key: indexnow-sent-${{ github.run_id }}
          restore-keys: indexnow-sent-

      - name: Notify IndexNow
        working-directory: docs
        run: node tools/indexnow.mjs --recent --state ../.indexnow/sent.json

      - name: Save Sent Pages
        uses: actions/cache/save@v4
        with:
          path: .indexnow/sent.json
          key: indexnow-sent-${{ github.run_id }}

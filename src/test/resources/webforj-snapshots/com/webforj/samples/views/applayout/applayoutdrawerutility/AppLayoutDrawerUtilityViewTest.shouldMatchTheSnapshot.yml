# webforJ testbed snapshot v1
- AppLayoutDrawerUtilityView [route=applayoutdrawerutility]:
  - Toolbar:
    - AppDrawerToggle [slot=start] [name=menu-2]
    - H3 "Application" [slot=title]
  - Div:
    - DrawerLogo:
      - Img [src=/img/webforj_icon.svg] [alt=logo]
    - AppNav:
      - AppNavItem "Dashboard" [path=/applayoutdrawerutility/content/Dashboard]:
        - Icon [slot=prefix] [name=dashboard]
      - AppNavItem "Orders" [path=/applayoutdrawerutility/content/Orders]:
        - Icon [slot=prefix] [name=shopping-cart]
      - AppNavItem "Customers" [path=/applayoutdrawerutility/content/Customers]:
        - Icon [slot=prefix] [name=users]
      - AppNavItem "Products" [path=/applayoutdrawerutility/content/Products]:
        - Icon [slot=prefix] [name=box]
      - AppNavItem "Documents" [path=/applayoutdrawerutility/content/Documents]:
        - Icon [slot=prefix] [name=files]
      - AppNavItem "Tasks" [path=/applayoutdrawerutility/content/Tasks]:
        - Icon [slot=prefix] [name=checklist]
      - AppNavItem "Analytics" [path=/applayoutdrawerutility/content/Analytics]:
        - Icon [slot=prefix] [name=chart-dots-2]
  - Div "Joe Smith"
  - IconButton [name=pin] [tooltip="Pin drawer"]
  - IconButton [name=rocket] [tooltip="Buy premium"]

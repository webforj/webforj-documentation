  - FlexLayout:
    - Badge "Default" [theme=outlined-default]
    - Badge "Primary" [theme=outlined-primary]
    - Badge "Success" [theme=outlined-success]
    - Badge "Warning" [theme=outlined-warning]
    - Badge "Danger" [theme=outlined-danger]
    - Badge "Info" [theme=outlined-info]
    - Badge "Gray" [theme=outlined-gray]
